<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille 24 h · Escale sous les étoiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c1017; --panel:#141b25; --panel2:#1b2430; --line:#26313f;
  --text:#dde5ef; --dim:#8d9bae; --faint:#5f6d80;
  --glow:#7fd4ff; --ember:#ff6b4a; --amber:#e8b13c; --ok:#5fbf8c;
  --serif:"Newsreader",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--glow)}
.wrap{max-width:780px;margin:0 auto;padding:0 22px 90px}

/* en-tête */
header{position:sticky;top:0;z-index:10;background:rgba(12,16,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:780px;margin:0 auto;padding:16px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--glow);font-weight:400}
.stat{margin-left:auto;font-size:12.5px;color:var(--faint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);display:inline-block;margin-right:6px}
.dot.live{background:var(--ok)} .dot.busy{background:var(--amber)} .dot.ko{background:var(--ember)}
.hd2{max-width:780px;margin:0 auto;padding:0 22px 13px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-size:13px;color:var(--dim);background:var(--panel)}
.btn:hover{color:var(--text);border-color:var(--faint)}
.btn.key{border-color:#3d5470;color:var(--text)}
.btn[disabled]{opacity:.45;cursor:default}
.solar{font-size:12.5px;color:var(--dim);padding:6px 0;align-self:center;margin-left:auto}
.solar b{color:var(--text);font-family:var(--serif);font-size:15px}

/* top 3 */
#top{margin:22px 0 6px;border:1px solid #2c3a4c;border-radius:4px;background:linear-gradient(180deg,#161f2b,#131a24);padding:16px 18px}
#top .th{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
#top .th h2{font-family:var(--serif);font-size:17px;font-weight:600;margin:0}
#top .th span{font-size:12px;color:var(--faint)}
#top .th button{margin-left:auto;font-size:12px;color:var(--faint)}
#top .th button:hover{color:var(--glow)}
.pick{display:grid;grid-template-columns:22px 1fr;gap:0 12px;padding:11px 0;border-top:1px solid #26313f;cursor:pointer}
.pick:first-of-type{border-top:none;padding-top:0}
.pick .r{font-family:var(--serif);font-size:20px;color:var(--glow);line-height:1.2}
.pick .t{font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.3;margin:0 0 3px}
.pick:hover .t{color:var(--glow)}
.pick .w{font-size:13.5px;color:var(--dim);margin:0}
.pick .m{font-size:12px;color:var(--faint);margin-top:3px}
.item.spot{background:rgba(127,212,255,.06);box-shadow:inset 2px 0 0 var(--glow)}

/* liste */
.item{border-bottom:1px solid var(--line);padding:18px 0}
.item .head{display:grid;grid-template-columns:3px 1fr;gap:0 15px;cursor:pointer}
.detail,.mb{cursor:auto;user-select:text}
.mh{cursor:pointer}
.age{border-radius:2px;background:#243040}
.age.h3{background:var(--glow);box-shadow:0 0 9px rgba(127,212,255,.45)}
.age.h12{background:#3f7f9e}
.meta{font-size:12.5px;color:var(--faint);margin-bottom:5px}
.meta .s{color:var(--dim)}
.fr{font-family:var(--serif);font-size:20px;line-height:1.32;font-weight:600;margin:0 0 4px;letter-spacing:-.005em}
.fr.raw{color:var(--dim);font-weight:400;font-style:italic}
.orig{font-size:13px;color:var(--faint);margin:0}

/* détail */
.detail{margin:14px 0 0 18px;padding:14px 16px;border-left:2px solid var(--line);background:var(--panel);border-radius:0 3px 3px 0}
.detail p{margin:0 0 10px;color:var(--dim);font-size:14px;max-width:64ch}
.detail .lbl{font-size:11.5px;color:var(--faint);margin-bottom:3px}
.detail .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.detail img{max-width:210px;border-radius:2px;float:right;margin:0 0 10px 14px}

/* slides */
.slides{margin-top:14px;display:grid;gap:8px}
.slide{border:1px solid var(--line);border-radius:3px;background:var(--panel2);padding:11px 13px}
.slide .n{font-size:11px;color:var(--faint);margin-bottom:3px}
.slide .t{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:4px}
.slide .x{font-size:13.5px;color:var(--dim)}
.slide.cover{background:#101822;border-color:#33455c;text-align:center;padding:16px 13px}
.slide .ct{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.02em;color:var(--amber)}
.slide .cs{font-family:var(--serif);font-size:16px;letter-spacing:.02em;color:var(--text)}
.slide .t{letter-spacing:.02em}
.slide mark{background:none;color:var(--amber);font-weight:500}
.slide .pu{margin:0;padding-left:17px;font-size:13.5px;color:var(--dim)}
.slide .pu li{margin-bottom:3px}
.slide .vis{margin-top:8px;font-size:12px;color:var(--faint);font-style:italic}
.vwarn{margin-top:6px;font-size:12px;color:var(--amber);border-left:2px solid #5c4a1e;padding-left:8px}
.vprompt{margin-top:7px;border:1px solid #2b3a4d;border-radius:3px;background:#0e151f;padding:8px 9px}
.vph{display:flex;align-items:center;font-size:11px;color:var(--faint);margin-bottom:4px}
.vph button{margin-left:auto;font-size:11px;color:var(--glow)}
.vprompt code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--dim);line-height:1.5;display:block;word-break:break-word}
.item.lu .fr{color:var(--dim);font-weight:400}
.item.lu .fr.raw{color:var(--faint)}
.item.lu .excerpt{color:var(--faint)}
.item.lu .age{opacity:.4}
.n-primaire{background:#122c26;color:#5fd0a8}
.n-redaction{background:#152838;color:var(--glow)}
.n-reprise{background:#33290f;color:var(--amber)}
.n-social{background:#2e1f16;color:#e39b7a}
.n-inconnu{background:#1c2431;color:var(--faint)}
.niv{border-radius:3px;padding:9px 11px;margin-bottom:11px;font-size:13px}
.niv b{font-size:13.5px}
.niv p{margin:4px 0 0;opacity:.82;font-size:12.5px;max-width:62ch}
.niv p.q{opacity:1;font-weight:500}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:2px;letter-spacing:.02em;white-space:nowrap}
.t-ok{background:#16301f;color:var(--ok)}
.t-warn{background:#3a2c12;color:var(--amber)}
.t-lu{background:#1c2431;color:var(--faint)}
.made{border-bottom:1px solid var(--line);padding:15px 0}
.mh{display:flex;gap:12px;align-items:flex-start}
.mh > div{flex:1;min-width:0}
.mt{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.3}
.mm{font-size:12px;color:var(--faint);margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mb{margin-top:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{padding:6px 13px;font-size:13px;color:var(--dim);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}
.eh{display:flex;align-items:center;gap:9px;margin:24px 0 14px}
.eh h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;flex:1}
.eh .btn{padding:5px 10px;font-size:12px}
.ev{display:grid;grid-template-columns:58px 1fr;gap:0 14px;padding:15px 0;border-top:1px solid var(--line)}
.eyr{font-family:var(--serif);font-size:21px;color:var(--glow);line-height:1.1}
.et{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.3}
.eago{font-size:12px;color:var(--faint);margin-bottom:5px}
.ed{margin:0;color:var(--dim);font-size:14px;max-width:62ch}
.theme{border-top:1px solid var(--line);padding-top:6px;margin-top:26px}
.hintline{font-size:12px;color:var(--faint);margin:7px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.im{margin:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel)}
.im img{width:100%;height:150px;object-fit:cover;display:block;background:var(--panel2)}
.im figcaption{padding:9px 10px}
.imt{font-size:13px;line-height:1.3;margin-bottom:4px}
.imc{font-size:11.5px;color:var(--amber);line-height:1.35}
.cit{border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.ct2{font-family:var(--serif);font-size:15.5px;line-height:1.3;margin-bottom:3px}
.cm{font-size:11.5px;color:var(--faint)}
.cb{display:flex;gap:11px;margin-top:7px;font-size:12px}
.cb a,.cb button{color:var(--dim);text-decoration:none;padding:0}
.cb a:hover{color:var(--glow)}
.cb button:hover{color:var(--ember)}
.cempty{color:var(--faint);font-size:13px;margin:0}
.legende .lg{margin-bottom:8px;font-size:13px}
.legende .lg b{margin-left:5px}
.legende .lg p{margin:3px 0 0;font-size:12px;color:var(--faint);max-width:62ch;line-height:1.45}
.legende .lg p.q2{color:var(--dim)}
.legende .lg b{display:inline-block;margin:3px 0 0 5px}
#carnetList{max-height:60vh;overflow-y:auto}
.vieux{border:1px solid #5c4a1e;background:#1d1810;border-radius:3px;padding:9px 11px;margin-bottom:11px;font-size:13px}
.vieux b{color:var(--amber);font-weight:500}
.vieux p{margin:4px 0 0;font-size:12.5px;color:var(--dim);max-width:62ch}
.audit{border-radius:3px;padding:11px 13px;font-size:13px;margin-bottom:8px;border:1px solid}
.audit.ok{border-color:#2c5a44;background:#0f1b16}
.audit.ko{border-color:#5c4a1e;background:#1d1810}
.audit b{display:block;margin-bottom:4px;font-weight:500}
.audit.ok b{color:var(--ok)} .audit.ko b{color:var(--amber)}
.audit .ccl{margin:0 0 8px;color:var(--dim);font-size:12.5px}
.audit ul{margin:0;padding-left:17px}
.audit li{margin-bottom:9px;line-height:1.45;color:var(--text)}
.audit .ex{color:var(--dim);font-size:12.5px}
.audit .sr{color:var(--faint);font-size:11.5px}
.v{display:inline-block;font-size:10px;padding:1px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:.03em;vertical-align:1px}
.v-confirme{background:#16301f;color:var(--ok)}
.v-non-confirme{background:#1c2431;color:var(--faint)}
.v-contredit{background:#4a1d16;color:#ff9d85}
.v-invraisemblable{background:#4a1d16;color:#ff9d85}
.v-imprecis{background:#3a2c12;color:var(--amber)}
.corr{border:1px solid #2b4a63;background:#101c26;border-radius:3px;padding:11px 13px;font-size:13px;color:var(--dim);margin-bottom:8px}
.corr b{color:var(--glow);display:block;margin-bottom:5px;font-weight:500}
.corr ul{margin:0;padding-left:18px}
.corr li{margin-bottom:4px;line-height:1.45}
.ok2{border:1px solid #2c5a44;background:#0f1b16;border-radius:3px;padding:11px 13px;font-size:13px;color:var(--dim)}
.ok2 b{color:var(--ok);font-weight:500}
.check.soft{border-color:#2c3a4c;background:#141b25}
.check.soft b{color:var(--dim)}
.check .pt{margin:0 0 6px;font-size:12px;color:var(--faint)}
.check li{margin-bottom:8px;line-height:1.45}
.check .w{color:var(--text);font-weight:500}
.check i{color:var(--faint)}
.g{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:.03em;vertical-align:1px}
.g-erreur{background:#4a1d16;color:#ff9d85}
.g-absent{background:#4a3a16;color:var(--amber)}
.g-nuance{background:#1e3448;color:var(--glow)}
.acts .on,.detail .btn.on{color:var(--amber);border-color:#5c4a1e;background:#211b0d}
.note{font-size:12px;color:var(--faint);margin-bottom:2px}
.check{border:1px solid #5c4a1e;background:#1d1810;border-radius:3px;padding:11px 13px;font-size:13px;color:var(--dim)}
.check b{color:var(--amber);display:block;margin-bottom:5px;font-weight:500}
.check ul{margin:0;padding-left:18px}
.check li{margin-bottom:3px}
.cap{border:1px dashed var(--line);border-radius:3px;padding:11px 13px;font-size:13.5px;color:var(--dim);white-space:pre-wrap}

.empty{padding:60px 0;color:var(--faint);font-family:var(--serif);font-style:italic;font-size:17px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:10px 18px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

dialog{border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text);max-width:560px;width:92vw;padding:0}
dialog::backdrop{background:rgba(6,9,14,.75)}
.dh{padding:15px 19px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:17px}
.db{padding:17px 19px}
.db label{display:block;font-size:12.5px;color:var(--faint);margin:12px 0 5px}
.db input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px 10px;outline:none}
.db input:focus{border-color:var(--glow)}
.db p{font-size:12.5px;color:var(--faint);margin:9px 0 0;line-height:1.5}
.df{padding:13px 19px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.srcs{max-height:200px;overflow-y:auto;margin-top:6px}
.srcs div{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:13px;color:var(--dim)}
.srcs label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.srcs .kill{color:var(--faint);font-size:15px;line-height:1;padding:0 3px}
.srcs .kill:hover{color:var(--ember)}
.addbox{display:flex;gap:6px}
.addbox input{flex:1;min-width:0}
input[type=checkbox]{accent-color:#4c8fb5;width:13px;height:13px}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:600px){.detail img{float:none;max-width:100%;margin:0 0 10px}}
</style>
</head>
<body>

<header>
  <div class="hd">
    <h1>Veille 24 h <em>Escale sous les étoiles</em></h1>
    <div class="stat" id="stat"><span class="dot"></span>démarrage</div>
  </div>
  <div class="hd2">
    <button class="btn" id="refresh">Actualiser</button>
    <button class="btn key" id="translate">Traduire les titres</button>
    <div class="seg"><button id="navNews" aria-pressed="true">24 h</button><button id="navMade">Carrousels</button><button id="navArch">Archives</button></div>
    <button class="btn" id="carnetBtn">Carnet<span id="carnetCount"></span></button>
    <button class="btn" id="settings">Reglages</button>
    <span class="solar" id="solar"></span>
  </div>
</header>

<div class="wrap">
  <div id="viewNews">
    <section id="top" hidden></section>
    <div id="list"><p class="empty">Chargement…</p></div>
  </div>
  <div id="viewMade" hidden></div>
  <div id="viewArch" hidden></div>
</div>

<div class="toast" id="toast"></div>

<dialog id="carnetDlg">
  <div class="dh">Carnet</div>
  <div class="db" id="carnetList"></div>
  <div class="df">
    <button class="btn" id="carnetClose">Fermer</button>
    <button class="btn" id="carnetExport">Tout exporter</button>
  </div>
</dialog>

<dialog id="dlg">
  <div class="dh">Reglages</div>
  <div class="db">
    <label>Longueur des textes de slide</label>
    <div class="seg" id="lenSeg">
      <button data-len="court">Court</button>
      <button data-len="moyen">Moyen</button>
      <button data-len="long">Long</button>
    </div>
    <p class="hintline">Court pour des visuels charges, long pour des sujets techniques.</p>
    <label for="styleia">Style graphique ajoute a chaque prompt image</label>
    <input id="styleia" autocomplete="off">
    <p class="hintline">Ajoute automatiquement a la fin de chaque prompt, pour que les images d'un meme carrousel se ressemblent.</p>
    <label>Nature des sources</label>
    <div class="legende" id="legende"></div>
    <label>Sources actives</label>
    <div class="srcs" id="srcs"></div>
    <label for="newFeed">Ajouter une source</label>
    <div class="addbox">
      <input id="newFeed" placeholder="Coller une adresse de flux RSS" autocomplete="off">
      <button class="btn" id="addFeed">Ajouter</button>
    </div>
  </div>
  <div class="df">
    <button class="btn" id="dlgClose">Fermer</button>
    <button class="btn key" id="dlgSave">Enregistrer</button>
  </div>
</dialog>

<script>
"use strict";

/* ---------- stockage ---------- */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return k in mem?mem[k]:d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;}}
};

/* ---------- sources ---------- */
const FEEDS=[
  {id:"nsf",  name:"NASASpaceflight",      url:"https://www.nasaspaceflight.com/feed/", fiab:"redaction", on:true},
  {id:"sfn",  name:"Spaceflight Now",      url:"https://spaceflightnow.com/feed/", fiab:"redaction", on:true},
  {id:"sn",   name:"SpaceNews",            url:"https://spacenews.com/feed/", fiab:"redaction", on:true},
  {id:"eusf", name:"European Spaceflight", url:"https://europeanspaceflight.com/feed/", fiab:"redaction", on:true},
  {id:"payl", name:"Payload",              url:"https://payloadspace.com/feed/", fiab:"redaction", on:true},
  {id:"ars",  name:"Ars Technica Space",   url:"https://feeds.arstechnica.com/arstechnica/space", fiab:"redaction", on:true},
  {id:"nasa", name:"NASA breaking news",   url:"https://www.nasa.gov/rss/dyn/breaking_news.rss", fiab:"primaire", on:true},
  {id:"esan", name:"ESA actualités",       url:"https://www.esa.int/rssfeed/Our_Activities/Space_News", fiab:"primaire", on:true},
  {id:"jpl",  name:"NASA JPL",             url:"https://www.jpl.nasa.gov/feeds/news/", fiab:"primaire", on:true},
  {id:"eso",  name:"ESO",                  url:"https://www.eso.org/public/rss/news/en/", fiab:"primaire", on:true},
  {id:"hst",  name:"ESA/Hubble",           url:"https://esahubble.org/rss/news/en/", fiab:"primaire", on:true},
  {id:"jwst", name:"ESA/Webb",             url:"https://esawebb.org/rss/news/en/", fiab:"primaire", on:true},
  {id:"noir", name:"NOIRLab",              url:"https://noirlab.edu/public/news/feed/", fiab:"primaire", on:true},
  {id:"apod", name:"APOD",                 url:"https://apod.nasa.gov/apod.rss", fiab:"primaire", on:true},
  {id:"aas",  name:"AAS Nova",             url:"https://aasnova.org/feed/", fiab:"redaction", on:true},
  {id:"phys", name:"Phys.org astronomie",  url:"https://phys.org/rss-feed/space-news/astronomy/", fiab:"reprise", on:true},
  {id:"ut",   name:"Universe Today",       url:"https://www.universetoday.com/feed/", fiab:"reprise", on:true},
  {id:"snt",  name:"Sky & Telescope",      url:"https://skyandtelescope.org/astronomy-news/feed/", fiab:"redaction", on:true},
  {id:"futura",name:"Futura espace",       url:"https://www.futura-sciences.com/rss/espace/actualites.xml", fiab:"reprise", on:true},
  {id:"ciel", name:"Ciel & Espace",        url:"https://www.cieletespace.fr/rss", fiab:"reprise", on:false},

  // comptes Bluesky : souvent les premiers à publier

const OWN_API = /^https?:$/.test(location.protocol) ? "/api/feed?url=" : null;
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  u => "https://r.jina.ai/" + u
];

async function grab(url, ms){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try{ return await fetch(url, {cache:"no-store", signal:c.signal}); }
  finally{ clearTimeout(t); }
}
async function getText(url, opts){
  opts = opts || {};
  if(opts.direct){
    try{ const r = await grab(url, 6000); if(r.ok) return await r.text(); }catch(e){}
  }
  const off = (opts.offset || 0) % PROXIES.length;
  const chain = PROXIES.slice(off).concat(PROXIES.slice(0, off));
  if(OWN_API) chain.unshift(u => OWN_API + encodeURIComponent(u));
  let last = null;
  for(const p of chain){
    try{
      const r = await grab(p(url), 15000);
      if(!r.ok){ last = "relais " + r.status; continue; }
      const t = await r.text();
      if(t && t.length > 80) return t;
      last = "réponse vide";
    }catch(e){ last = e.name === "AbortError" ? "délai dépassé" : e.message; }
  }
  throw new Error(last || "injoignable");
}
async function pool(list, n, fn){
  let i = 0;
  const run = async () => { while(i < list.length){ const k = i++; await fn(list[k], k); } };
  await Promise.all(new Array(Math.min(n, list.length)).fill(0).map(run));
}

/* ---------- analyse ---------- */
function kids(el, name){
  const out = [];
  for(const c of el.children){
    const ln = c.localName || c.nodeName.replace(/^.*:/, "");
    if(ln === name) out.push(c);
  }
  return out;
}
function txt(el, name){ const k = kids(el, name)[0]; return k ? k.textContent.trim() : ""; }
function strip(h){
  return (h||"").replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ")
    .replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&quot;/g,'"')
    .replace(/&#0?39;|&apos;|&rsquo;|&#8217;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&#8230;|&hellip;/g,"…").replace(/\s+/g," ").trim();
}
function parseFeed(xml, feed){
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("XML illisible");
  let nodes = Array.from(doc.getElementsByTagName("item"));
  let atom = false;
  if(!nodes.length){ nodes = Array.from(doc.getElementsByTagName("entry")); atom = true; }
  if(!nodes.length) throw new Error("aucun article");

  return nodes.map(n => {
    let link = "";
    if(atom){
      for(const l of kids(n,"link")){
        const rel = l.getAttribute("rel");
        if(!rel || rel === "alternate"){ link = l.getAttribute("href") || ""; break; }
      }
    }
    if(!link) link = txt(n,"link") || txt(n,"guid");
    let t = Date.parse(txt(n,"pubDate") || txt(n,"published") || txt(n,"updated") || txt(n,"date"));
    if(isNaN(t)) t = 0;
    const body = txt(n,"encoded") || txt(n,"content") || txt(n,"description") || txt(n,"summary");
    let author = txt(n,"creator") || txt(n,"author");
    const au = kids(n,"author")[0];
    if(au && !author) author = txt(au,"name");
    author = strip(author).slice(0,80);

    let img = "";
    for(const e of kids(n,"enclosure")){
      if((e.getAttribute("type")||"").startsWith("image")){ img = e.getAttribute("url")||""; break; }
    }
    if(!img) for(const name of ["content","thumbnail"]){
      for(const e of kids(n,name)){
        const u = e.getAttribute("url"), ty = e.getAttribute("type")||e.getAttribute("medium")||"";
        if(u && (ty.indexOf("image") === 0 || /\.(jpe?g|png|webp|gif)/i.test(u))){ img = u; break; }
      }
      if(img) break;
    }
    if(!img){ const m = /<img[^>]+src=["']([^"'>]+)["']/i.exec(body||""); if(m) img = m[1]; }
    if(img.indexOf("//") === 0) img = "https:" + img;

    return {
      key: (link || "").replace(/[?#].*$/,""),
      title: strip(txt(n,"title")) || "(sans titre)",
      link, t, src: feed.name, author, fiab: feed.fiab || "inconnu",
      social: /bsky\.app/i.test(feed.url),
      excerpt: strip(body).slice(0, 500),
      img: /^https?:/.test(img) ? img : "",
      fr: null, slides: null, working: false
    };
  }).filter(x => x.title && x.link);
}

const DAY = 24 * 3600e3;

async function load(){
  if(busy) return;
  busy = true;
  const active = feeds.filter(f => f.on);
  const cutoff = Date.now() - DAY;
  const cache = store.get("v24.cache", {});   // key -> {fr, slides}
  const seenKeys = new Set();
  const found = [];
  let done = 0, ko = 0;

  setStat("busy", "récupération…");

  await pool(active, 5, async (f, k) => {
    try{
      const rows = parseFeed(await getText(f.url, {offset:k}), f);
      rows.forEach(r => {
        if(!r.t || r.t < cutoff) return;
        if(seenKeys.has(r.key)) return;
        seenKeys.add(r.key);
        const c = cache[r.key];
        if(c){ r.fr = c.fr; r.slides = c.slides; }
        found.push(r);
      });
    }catch(e){ ko++; }
    finally{
      done++;
      found.sort((a,b) => b.t - a.t);
      items = found.slice();
      setStat("busy", done + " / " + active.length + " sources · " + items.length + " articles");
      render();
    }
  });

  busy = false;
  setStat(ko === active.length ? "ko" : "live",
    items.length + " articles sur 24 h" + (ko ? " · " + ko + " source(s) muette(s)" : ""));
  render();
  if(items.some(x => !x.fr) && hasAI()) translateAll();
  else pickTop(false);
}

function setStat(kind, s){

function ago(t){
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 60) return "il y a " + m + " min";
  const h = Math.round(m / 60);
  return "il y a " + h + " h";
}
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function cacheSave(x){
  const c = store.get("v24.cache", {});
  c[x.key] = {fr: x.fr, slides: x.slides};
  const keys = Object.keys(c);
  if(keys.length > 400) keys.slice(0, keys.length - 400).forEach(k => delete c[k]);
  store.set("v24.cache", c);
}

async function pickTop(force){
  if(top3Busy || !hasAI() || items.length < 4) return;
  const pool = items.slice(0, 45);
  const sig = pool.slice(0, 12).map(x => x.key).join("|");

    if(c && c.sig === sig){ top3 = c; renderTop(); return; }
  }

  top3Busy = true; renderTop();
  try{
    const payload = pool.map((x, i) => ({
      i,
      titre: x.fr || x.title,
      source: x.src,
      extrait: x.excerpt.slice(0, 200)
    }));
    const out = await ask(
      STYLE + " Tu réponds uniquement par du JSON, sans texte autour.",
      "Voici les actualités spatiales des dernières 24 heures. Choisis les 3 plus intéressantes " +
      "pour un large public curieux, pas pour des spécialistes.\n\n" +
      "Critères, dans cet ordre : une information nouvelle et concrète plutôt qu'une annonce vague, " +
      "quelque chose qui se raconte et se comprend sans bagage technique, " +
      "un potentiel visuel ou une part de merveilleux. " +
      "Écarte les communiqués institutionnels sans substance, les lancements de routine " +
      "et les sujets purement industriels ou budgétaires, sauf s'ils marquent une vraie rupture.\n\n" +
      "Pour chacune, explique en une phrase de 15 à 25 mots pourquoi elle mérite l'attention.\n" +
      "Classe de la plus forte à la moins forte.\n" +
      "Format JSON : [{\"i\": nombre, \"pourquoi\": \"\"}]\n\n" +
      JSON.stringify(payload),
      900
    );
    const picks = parseJson(out).slice(0, 3)
      .map(o => ({key: pool[o.i] && pool[o.i].key, why: o.pourquoi}))
      .filter(p => p.key);
    top3 = {sig, picks, at: Date.now()};
    store.set("v24.top", top3);
  }catch(e){
    toast("Classement impossible : " + e.message);
  }finally{
    top3Busy = false; renderTop();
  }

function renderTop(){
  const box = document.getElementById("top");

    box.hidden = false;

function detailHtml(x){
  let s = '<div class="detail">';
  if(x.img) s += '<img src="' + esc(x.img) + '" alt="" loading="lazy" onerror="this.remove()">';
  if(x.decalage){
    s += '<div class="vieux"><b>Article plus ancien que sa reprise</b>' +
      '<p>Le flux l\'a diffuse ' + ago(x.t) + ', mais la page indique une publication du ' +
      new Date(x.publie).toLocaleDateString("fr-FR") + ', soit ' + x.decalage + ' jours plus tot. ' +
      'Verifie s\'il s\'agit d\'une vraie nouveaute ou d\'une republication.</p></div>';
  }
  const nv = niveau(x);
  s += '<div class="lbl">Nature de la source</div>' +
    '<div class="niv n-' + esc(x.fiab || "inconnu") + '"><b>' + esc(nv.nom) + '</b>' +
    '<p>' + esc(nv.dit) + '</p><p class="q">' + esc(nv.quoi) + '</p></div>';
  s += '<div class="lbl">Source</div>';
  s += '<p><a href="' + esc(x.link) + '" target="_blank" rel="noopener">' + esc(x.src) + ' · ouvrir l\'article original</a><br>' +
       '<span style="color:var(--faint);font-size:12.5px">' + esc(x.link) + '</span></p>';
  if(x.author) s += '<div class="lbl">Signé</div><p>' + esc(x.author) + '</p>';
  s += '<div class="lbl">Titre d\'origine</div><p>' + esc(x.title) + '</p>';
  if(x.excerpt) s += '<div class="lbl">Extrait du flux</div><p>' + esc(x.excerpt) + '</p>';
  s += '<div class="row">' +
    '<button class="btn key" data-act="slides"' + (x.working ? " disabled" : "") + '>' +
      (x.working ? (x.step || "…") : x.slides ? "Régénérer le carrousel" : "Générer le carrousel") + '</button>' +
    '<button class="btn" data-act="copylink">Copier le lien</button>' +
    (x.slides ? '<button class="btn" data-act="audit"' + (x.auditing ? " disabled" : "") + '>' +
      (x.auditing ? "Audit…" : x.slides._audit ? "Refaire l\'audit" : "Vérification approfondie") + '</button>' : '') +
    (x.slides ? '<button class="btn" data-act="verify"' + (x.checking ? " disabled" : "") + '>' +
      (x.checking ? "Relecture…" : "Relire") + '</button>' : '') +
    '<button class="btn' + (inCarnet(x.key) ? " on" : "") + '" data-act="keep">' +
      (inCarnet(x.key) ? "Dans le carnet" : "Garder") + '</button>' +
  '</div>';

  if(x.slides){
    s += slidesHtml(x);
    s += '<div class="row">' +
      '<button class="btn" data-act="copyslides">Copier le carrousel</button>' +
      '<button class="btn" data-act="copyprompts">Copier tous les prompts</button>' +
      '<button class="btn" data-act="dlslides">Télécharger .md</button>' +
    '</div>';
  }
  return s + '</div>';
}

/* ---------- IA, via le serveur ---------- */
// Aucune clé dans le navigateur : c'est /api/ai qui détient la clé, côté Vercel.
function hasAI(){ return OWN_API !== null; }
let lastTruncated = false;

async function ask(system, user, maxTokens, opts){
  if(!hasAI()) throw new Error("disponible une fois la page en ligne, pas en ouvrant le fichier depuis le disque");
  const r = await fetch("/api/ai", {
    method: "POST",
    headers: {"content-type":"application/json"},
    body: JSON.stringify(Object.assign({system, user, max_tokens: maxTokens}, opts || {}))
  });
  const data = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(data.error || ("serveur " + r.status));
  if(data.stop_reason === "max_tokens") lastTruncated = true;
  return data.text || "";
}
// Repare un JSON coupe en cours de route : referme la chaine et les blocs ouverts.
function repairJson(t){
  let out = t, inStr = false, esc = false;
  const stack = [];
  for(let i = 0; i < out.length; i++){
    const c = out[i];
    if(inStr){
      if(esc) esc = false;
      else if(c === "\\") esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; continue; }
    if(c === "{" || c === "[") stack.push(c);
    else if(c === "}" || c === "]") stack.pop();
  }
  if(inStr) out += '"';
  out = out.replace(/[,\s]*$/, "");
  if(/:\s*$/.test(out)) out += '""';
  while(stack.length) out += (stack.pop() === "{" ? "}" : "]");
  return out;
}

function parseJson(s){
  const clean = s.replace(/```json|```/g, "").trim();
  const a = clean.indexOf("["), b = clean.indexOf("{");
  const start = (a >= 0 && (b < 0 || a < b)) ? a : b;
  const body = start > 0 ? clean.slice(start) : clean;
  try{
    return JSON.parse(body);
  }catch(e){
    const rep = JSON.parse(repairJson(body));   // leve a nouveau si irreparable
    rep._tronque = true;
    return rep;
  }
}

async function translateAll(){
  const todo = items.filter(x => !x.fr);
  if(!todo.length){ toast("Titres déjà traduits"); return; }
  if(!hasAI()){ toast("Mets la page en ligne pour activer la traduction"); return; }

  const btn = document.getElementById("translate");
  btn.disabled = true; btn.textContent = "Traduction…";

  try{
    for(let i = 0; i < todo.length; i += 25){
      const batch = todo.slice(i, i + 25);
      const payload = batch.map((x, j) => ({
        i: j,
        titre: x.title,
        extrait: x.excerpt.slice(0, 300)
      }));
      const out = await ask(
        STYLE + " Tu réponds uniquement par du JSON, sans texte autour.",
        "Pour chaque élément, écris un titre en français d'une seule phrase, 12 à 20 mots, " +
        "qui dise concrètement ce qui s'est passé et pourquoi c'est notable. Pas de titre vague. " +
        "Réponds par un tableau JSON d'objets {\"i\": nombre, \"fr\": \"titre\"}.\n\n" +
        JSON.stringify(payload),
        2500
      );
      parseJson(out).forEach(o => {
        const x = batch[o.i];
        if(x && o.fr){ x.fr = o.fr; cacheSave(x); }
      });
      render();
    }
    toast("Titres traduits");
    pickTop(false);
  }catch(e){
    toast("Traduction impossible : " + e.message);
  }finally{
    btn.disabled = false; btn.textContent = "Traduire les titres";
  }
}

const corpus = new Map();   // key -> texte de l'article, gardé le temps de la session

async function fetchArticle(x){
  if(x.social) return {ok:false, why:"message de réseau social, pas d'article à récupérer"};
  try{
    const r = await fetch("/api/article?url=" + encodeURIComponent(x.link));
    return await r.json();
  }catch(e){ return {ok:false, why:e.message}; }
}

async function makeSlides(x){

    const corps = art.ok ? art.text : x.excerpt;

    if(art.publie){
      const dp = Date.parse(art.publie);
      if(!isNaN(dp)){

        const ecart = Math.round((x.t - dp) / 86400e3);

// Corrige le brouillon a partir des ecarts releves, en restant dans la source.
async function corriger(x, ecarts, corps){
  const draft = JSON.parse(JSON.stringify(x.slides));
  delete draft._note; delete draft._full; delete draft._check; delete draft._corrections;

  const consigne = [
    "Un relecteur a releve des ecarts entre ce brouillon et le texte source.",
    "Corrige le brouillon pour les faire disparaitre.",
    "",
    "REGLES DE CORRECTION",
    "Tu ne touches qu'aux passages concernes par les ecarts. Tout le reste est reproduit a l'identique.",
    "Une erreur se corrige en retablissant ce que dit reellement la source.",
    "Sauf si l'erreur vient de la source elle-meme : dans ce cas, supprime le chiffre",
    "plutot que de le recopier, et garde ce qui est certain. Mieux vaut ne pas donner",
    "de dimension que d'en donner une fausse.",
    "Une nuance se corrige en retablissant la prudence : prevu au lieu de fait, une partie au lieu de la totalite.",
    "Un point absent se corrige en supprimant l'affirmation, ou en la remplacant par ce que la source permet d'ecrire.",
    "Tu ne rajoutes aucune information nouvelle et tu ne comptes que sur le texte source.",
    "Si un slide perd sa substance apres correction, reecris le entierement a partir d'un autre element du texte source, en gardant son titre ou en le changeant si besoin.",
    "",
    "Le champ surligner de chaque slide doit rester coherent : chaque expression doit se retrouver mot pour mot dans le texte du slide corrige. Reprends les si le texte a change.",
    "Le titre de couverture reste une reformulation fidele du titre de l'article.",
    "",
    "TEXTE SOURCE",
    corps,
    "FIN DU TEXTE SOURCE",
    "",
    "ECARTS RELEVES",
    JSON.stringify(ecarts),
    "",
    "BROUILLON A CORRIGER",
    JSON.stringify(draft),
    "",
    "Reponds par le JSON complet du carrousel corrige, exactement la meme structure que le brouillon,",
    'plus un champ corrections : ["ce qui a ete change, une ligne par correction"].'
  ].join("\n");

  const out = await ask(
    STYLE + " Tu reponds uniquement par du JSON, sans texte autour.",
    consigne,
    6000
  );
  return parseJson(out);
}

// Verification approfondie : l'auditeur sort de l'article et recoupe sur le web.
async function audit(x){
  if(!x.slides || !hasAI()) return;
  x.auditing = true; x.step3 = "Recherche des sources…"; render();

  const draft = {
    couverture: (x.slides.titre || "") + " / " + (x.slides.sous_titre || ""),
    slides: (x.slides.slides || []).map(sl => ({
      titre: sl.titre,
      contenu: sl.type === "liste" ? (sl.puces || []).join(" | ") : sl.texte
    })),
    legende: x.slides.legende
  };

  const consigne = [
    "Tu audites un carrousel de vulgarisation avant sa publication.",
    "Tu disposes de la recherche web : sers t'en, ne te fie pas a ta memoire.",
    "",
    "ARTICLE D'ORIGINE : " + x.link,
    "SOURCE : " + x.src + (x.author ? ", par " + x.author : ""),
    "",
    "METHODE",
    "1. Liste chaque affirmation factuelle verifiable du carrousel : chiffres, dates,",
    "noms de personnes, d'engins et d'organisations, lieux, superlatifs, premieres,",

function auditHtml(x){
  const a = x.slides && x.slides._audit;
  if(x.auditing) return '<div class="check"><b>' + esc(x.step3 || "Audit en cours…") + '</b>' +
    '<p class="pt">Recherche sur le web, comptez une a deux minutes.</p></div>';
  if(!a) return "";

  const ordre = {contredit:0, invraisemblable:1, imprecis:2, "non confirme":3, confirme:4};
  const vs = a.verdicts.slice().sort((p, q) =>
    (ordre[p.verdict] === undefined ? 5 : ordre[p.verdict]) -
    (ordre[q.verdict] === undefined ? 5 : ordre[q.verdict]));
  const pb = vs.filter(v => ["contredit","invraisemblable","imprecis"].indexOf(v.verdict) >= 0).length;

  let s = '<div class="audit' + (pb ? " ko" : " ok") + '">' +
    '<b>Verification approfondie : ' + (pb ? pb + " point(s) a traiter" : "rien de bloquant") + '</b>';
  if(a.conclusion) s += '<p class="ccl">' + esc(a.conclusion) + '</p>';
  s += '<ul>' + vs.map(v =>
    '<li><span class="v v-' + esc((v.verdict || "").replace(/\s/g, "-")) + '">' +
    esc(v.verdict || "?") + '</span> ' + esc(v.affirmation || "") +
    (v.explication ? '<br><span class="ex">' + esc(v.explication) + '</span>' : '') +
    (v.source ? '<br><span class="sr">' + esc(v.source) +
      (v.url ? ' · <a href="' + esc(v.url) + '" target="_blank" rel="noopener">voir</a>' : '') +
      '</span>' : '') + '</li>').join("") + '</ul></div>';
  return s;
}

// Relecture de controle : chaque affirmation est confrontee au texte source.
async function verify(x, passe){
  if(!x.slides || !hasAI()) return;
  passe = passe || 1;
  let corps = corpus.get(x.key);
  if(!corps){
    const art = await fetchArticle(x);
    corps = art.ok ? art.text : x.excerpt;
    corpus.set(x.key, corps);
  }
  x.checking = true; render();
  try{
    const draft = {
      couverture: (x.slides.titre || "") + " / " + (x.slides.sous_titre || ""),
      slides: (x.slides.slides || []).map(sl => ({
        titre: sl.titre,
        contenu: sl.type === "liste" ? (sl.puces || []).join(" | ") : sl.texte
      })),
      legende: x.slides.legende
    };
    const consigne = [
      "Confronte le brouillon au texte source. Passe en revue chaque affirmation factuelle :",
      "chiffres, dates, heures, durees, noms de personnes, d'engins et d'organisations,",
      "lieux, liens de cause a effet, superlatifs et premieres.",
      "",
      "Signale un ecart dans ces cas : l'information ne figure pas dans la source,",
      "elle la contredit, elle transforme une prevision ou une hypothese en fait etabli,",
      "ou elle est exageree par rapport a ce que dit la source.",
      "Ne signale jamais un choix de style, de ton ou de formulation.",
      "Une reformulation fidele n'est pas un ecart.",
      "",
      "DEUXIEME CONTROLE, AUSSI IMPORTANT QUE LE PREMIER : la vraisemblance physique.",
      "Etre fidele a la source ne suffit pas. Une source peut se tromper, et la presse",
      "recopie souvent des chiffres faux. Confronte donc chaque grandeur a la realite,",
      "pas seulement au texte.",
      "Compare toute taille, distance, duree, vitesse ou masse a un ordre de grandeur connu :",
      "diametre de la Terre 12 742 km, de la Lune 3 475 km, de Jupiter 139 820 km,",
      "de Saturne 120 536 km, du Soleil 1 392 700 km, distance Terre Lune 384 400 km,",
      "unite astronomique 149,6 millions de km, annee-lumiere 9 461 milliards de km.",
      "Une structure posee sur un astre ne peut pas etre plus large que cet astre.",
      "Une orbite ne peut pas etre plus petite que le corps orbite.",
      "Une duree de mission ne peut pas depasser l'age de la mission.",
      "Mefie-toi particulierement des confusions classiques : un perimetre presente comme",
      "un diametre, un rayon pris pour un diametre, un total pris pour une unite,",
      "une somme de cotes presentee comme une largeur. Verifie par le calcul quand deux",
      "chiffres sont donnes ensemble : si le grand vaut exactement dix fois le petit et",
      "que la figure a dix cotes, le grand est un perimetre, pas une largeur.",
      "Si un chiffre est invraisemblable, signale le en gravite erreur meme s'il est",
      "recopie fidelement depuis la source, et dis dans probleme quel ordre de grandeur",
      "il contredit.",
      "",
      "Gravite : erreur si c'est faux, invraisemblable ou contredit par la source,",
      "absent si l'information n'y figure pas et ne peut etre confirmee,",
      "nuance si le sens est deforme ou durci.",
      "",
      "Le champ ou indique le slide concerne. Le champ affirmation reprend le passage exact.",
      "Le champ probleme explique en une phrase, et dit ce que la source permet d'ecrire a la place.",
      "",
      "TEXTE SOURCE",
      corps,
      "FIN DU TEXTE SOURCE",
      "",
      "BROUILLON",
      JSON.stringify(draft),
      "",
      'JSON attendu : {"verdict":"conforme" ou "a_corriger","ecarts":[{"ou":"","affirmation":"","probleme":"","gravite":"erreur"}]}'
    ].join("\n");

    const out = await ask(
      "Tu es relecteur de verification pour un media scientifique. Tu es methodique et sans complaisance. " +
      "Tu reponds uniquement par du JSON, sans texte autour.",
      consigne,
      1800
    );
    const v = parseJson(out);
    const ecarts = Array.isArray(v.ecarts) ? v.ecarts : [];

    if(ecarts.length && passe === 1){
      x.step2 = "Correction de " + ecarts.length + " point(s)…";
      render();
      const corrige = await corriger(x, ecarts, corps);
      const anciennes = x.slides._corrections || [];
      const note = x.slides._note, full = x.slides._full;
      x.slides = corrige;
      x.slides._note = note;
      x.slides._full = full;
      x.slides._corrections = anciennes.concat(
        Array.isArray(corrige.corrections) ? corrige.corrections : []);
      delete x.slides.corrections;
      cacheSave(x);
      x.step2 = "Seconde vérification…";
      render();
      x.checking = false;
      return verify(x, 2);
    }

    x.slides._check = {
      verdict: v.verdict,
      ecarts: ecarts,
      at: Date.now(),
      partiel: !x.slides._full,
      passes: passe
    };
    cacheSave(x);
    if(made.some(m => m.key === x.key)) saveMade(x);
    const nc = (x.slides._corrections || []).length;
    toast(ecarts.length
      ? (nc ? nc + " correction(s), " : "") + ecarts.length + " point(s) de vigilance"
      : (nc ? nc + " correction(s) appliquée(s), texte conforme" : "Relecture : rien à signaler"));
  }catch(e){
    toast("Relecture impossible : " + e.message);
  }finally{
    x.checking = false; x.step2 = null; render();
  }
}

function promptsText(x){
  const all = [];
  if(x.slides.titre){
    if(x.slides.type_visuel === "archive")
      all.push("COUVERTURE\nArchive recommandée : " + (x.slides.visuel || "image d'illustration du sujet"));
    else if(x.slides.prompt_ia)
      all.push("COUVERTURE\n" + promptComplet(x.slides));
    else
      all.push("COUVERTURE\nAucun prompt fourni, regenere le carrousel.");
  }
  (x.slides.slides || []).forEach((sl, i) => {
    if(sl.type_visuel === "archive")
      all.push("SLIDE " + (i + 2) + "\nArchive recommandee : " + (sl.visuel || ""));
    else if(sl.prompt_ia)
      all.push("SLIDE " + (i + 2) + "\n" + promptComplet(sl));
  });
  return all.join("\n\n") || "Aucun prompt disponible.";
}

function slidesText(x){
  const cr = x.author ? x.author + " pour " + x.src : x.src;
  let s = (x.fr || x.title) + "\n" + cr + " · " +
    new Date(x.t).toLocaleString("fr-FR") + "\n" + x.link + "\n";
  if(x.slides && x.slides._note) s += "Rédigé sur : " + x.slides._note + "\n";
  if(x.social) s += "Source : message de réseau social, information à confirmer\n";
  s += "\n";

  if(x.slides.titre){
    s += "COUVERTURE\n" + x.slides.titre + "\n" + (x.slides.sous_titre || "") + "\n";
    if(x.slides.visuel) s += "Image à chercher : " + x.slides.visuel + "\n";
    if(x.slides.type_visuel === "archive") s += "Archive recommandée, pas d'image générée\n";
    else if(x.slides.prompt_ia) s += "Prompt IA : " + promptComplet(x.slides) + "\n";
    s += "\n";
  }
  (x.slides.slides || []).forEach((sl, i) => {
    s += "SLIDE " + (i + 2) + " · " + sl.titre + "\n";
    if(sl.type === "liste" && Array.isArray(sl.puces)){
      sl.puces.forEach(p => { s += "- " + p + "\n"; });
    }else{
      s += (sl.texte || "") + "\n";
    }
    if(Array.isArray(sl.surligner) && sl.surligner.length){
      s += "À surligner : " + sl.surligner.join(" | ") + "\n";
    }
    if(sl.visuel) s += "Image à chercher : " + sl.visuel + "\n";
    if(sl.type_visuel === "archive") s += "Archive recommandée, pas d'image générée\n";
    else if(sl.prompt_ia) s += "Prompt IA : " + promptComplet(sl) + "\n";
    s += "\n";
  });

  if(x.slides.legende) s += "LÉGENDE\n" + x.slides.legende + "\n\n";
  if(x.slides.hashtags) s += x.slides.hashtags + "\n\n";
  const au = x.slides._audit;
  if(au && au.verdicts.length){
    s += "VERIFICATION APPROFONDIE\n";
    if(au.conclusion) s += au.conclusion + "\n";
    au.verdicts.forEach(v => {
      s += "- [" + (v.verdict || "") + "] " + (v.affirmation || "") + "\n";
      if(v.explication) s += "  " + v.explication + "\n";
      if(v.source) s += "  source : " + v.source + (v.url ? " " + v.url : "") + "\n";
    });
    s += "\n";
  }
  const corr = x.slides._corrections;
  if(Array.isArray(corr) && corr.length){
    s += "CORRECTIONS APPLIQUEES AUTOMATIQUEMENT\n";
    corr.forEach(c => { s += "- " + c + "\n"; });
    s += "\n";
  }
  const ck2 = x.slides._check;
  if(ck2 && ck2.ecarts.length){
    s += "POINTS DE VIGILANCE\n";
    ck2.ecarts.forEach(e => {
      s += "- [" + (e.gravite || "") + "] " + (e.ou || "") + " : " + (e.probleme || "") + "\n";
    });
    s += "\n";
  }
  const av = x.slides.a_verifier;
  if(Array.isArray(av) && av.length){
    s += "À CONFIRMER SUR L'ARTICLE\n";
    av.forEach(v => { s += "- " + v + "\n"; });
  }
  return s;
}

/* ---------- météo solaire ---------- */
async function solar(){
  try{
    const kp = JSON.parse(await getText("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json", {direct:true}));
    let v = NaN;
    for(let i = kp.length - 1; i > 0; i--){
      const n = parseFloat(kp[i][1]);
      if(isFinite(n)){ v = n; break; }
    }
    if(!isFinite(v)) return;
    const say = v >= 7 ? "orage sévère, aurores possibles bas en latitude"
              : v >= 5 ? "orage géomagnétique en cours"
              : v >= 4 ? "agitation, à surveiller" : "activité calme";
    document.getElementById("solar").innerHTML =
      '<b style="color:' + (v >= 5 ? "var(--ember)" : v >= 4 ? "var(--amber)" : "var(--text)") + '">Kp ' + v.toFixed(1) + '</b> ' + say;
  }catch(e){}
}

function toast(m){

  t.textContent = m; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);

document.getElementById("list").addEventListener("click", e => {
  const art = e.target.closest(".item"); if(!art) return;
  const x = items.find(i => i.key === art.dataset.k); if(!x) return;

  const b = e.target.closest("button[data-act]");
  if(b){
    const a = b.dataset.act;
    if(a === "slides") makeSlides(x);
    if(a === "copylink") navigator.clipboard.writeText(x.link).then(() => toast("Lien copié"));
    if(a === "verify") verify(x);
    if(a === "audit") audit(x);
    if(a === "copyprompts") navigator.clipboard.writeText(promptsText(x)).then(() => toast("Prompts copiés"));
    if(a === "keep") toggleCarnet(x);
    if(a === "copyslides") navigator.clipboard.writeText(slidesText(x)).then(() => toast("Carrousel copié"));
    if(a === "dlslides"){
      const blob = new Blob([slidesText(x)], {type:"text/markdown"});
      const el = document.createElement("a");
      el.href = URL.createObjectURL(blob);
      el.download = "carrousel-" + new Date().toISOString().slice(0,10) + ".md";
      el.click(); URL.revokeObjectURL(el.href);
    }
    return;
  }
  if(e.target.closest("a")){ marquerLu(x.key); render(); return; }
  // on ne replie que depuis l'en-tete de l'article, sinon selectionner du texte
  // dans le panneau ouvert le ferait disparaitre
  if(!e.target.closest(".head")) return;
  if(String(window.getSelection ? window.getSelection() : "").length > 2) return;
  openId = (openId === x.key) ? null : x.key;
  if(openId) marquerLu(x.key);
  render();
});

function saveMade(x){
  const snap = {
    key: x.key, title: x.title, fr: x.fr, link: x.link, src: x.src,
    t: x.t, excerpt: x.excerpt, img: x.img, author: x.author,
    social: x.social, slides: x.slides, quand: Date.now()
  };
  const i = made.findIndex(m => m.key === x.key);
  if(i >= 0) made[i] = snap; else made.unshift(snap);
  if(made.length > 80) made.length = 80;
  store.set("v24.made", made);
  drawMadeBtn();
}

function drawMadeBtn(){
  const b = document.getElementById("navMade");
  if(b) b.textContent = "Carrousels" + (made.length ? " (" + made.length + ")" : "");
}

function renderMade(){
  const box = document.getElementById("viewMade");
  if(!made.length){
    box.innerHTML = '<p class="empty">Aucun carrousel pour l\'instant. ' +
      'Genere en un depuis l\'onglet 24 h ou depuis l\'ephemeride.</p>';
    return;
  }
  box.innerHTML = '<div class="eh"><h2>Carrousels generes</h2>' +
    '<button class="btn" id="madeExport">Tout exporter</button></div>' +
    made.map(m => {
      const ouvert = madeOpen === m.key;
      const ck = m.slides && m.slides._check;
      let etat = "";
      if(ck) etat = ck.ecarts.length
        ? '<span class="tag t-warn">' + ck.ecarts.length + ' point(s) a revoir</span>'
        : '<span class="tag t-ok">relu, conforme</span>';
      return '<article class="made" data-m="' + esc(m.key) + '">' +
        '<div class="mh">' +
          '<div><div class="mt">' + esc((m.slides && m.slides.titre) || m.fr || m.title) + '</div>' +
          '<div class="mm">' + esc(m.src) + ' &middot; genere le ' +
            new Date(m.quand).toLocaleDateString("fr-FR") + ' a ' +
            new Date(m.quand).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}) +
            ' ' + etat + '</div></div>' +
          '<button class="btn mo">' + (ouvert ? "replier" : "voir") + '</button>' +
        '</div>' +
        (ouvert ? madeBody(m) : '') +
      '</article>';
    }).join("");
}

function madeBody(m){
  const x = Object.assign({}, m);
  let s = '<div class="mb">';
  s += '<div class="cb"><a href="' + esc(m.link) + '" target="_blank" rel="noopener">ouvrir la source</a>' +
    '<button data-mact="copy">copier</button>' +
    '<button data-mact="dl">telecharger .md</button>' +
    '<button data-mact="del">supprimer</button></div>';
  s += slidesHtml(x);
  return s + '</div>';
}

document.getElementById("viewMade").addEventListener("click", e => {
  if(e.target.id === "madeExport"){
    let out = "# Carrousels generes\n\n";
    made.forEach(m => { out += slidesText(m) + "\n---\n\n"; });
    dlText(out, "carrousels-" + new Date().toISOString().slice(0,10) + ".md");
    return;
  }
  const art = e.target.closest(".made"); if(!art) return;
  const m = made.find(z => z.key === art.dataset.m); if(!m) return;
  const b = e.target.closest("button[data-mact]");
  if(b){
    if(b.dataset.mact === "copy") navigator.clipboard.writeText(slidesText(m)).then(() => toast("Copie"));
    if(b.dataset.mact === "dl") dlText(slidesText(m), "carrousel-" + new Date().toISOString().slice(0,10) + ".md");
    if(b.dataset.mact === "del"){
      made = made.filter(z => z.key !== m.key);
      store.set("v24.made", made);
      drawMadeBtn(); renderMade();
    }
    return;
  }
  if(e.target.closest("a")) return;
  if(!e.target.closest(".mh")) return;
  if(String(window.getSelection ? window.getSelection() : "").length > 2) return;
  madeOpen = madeOpen === m.key ? null : m.key;
  renderMade();
});

function dlText(txt, nom){
  const blob = new Blob([txt], {type:"text/markdown"});
  const el = document.createElement("a");
  el.href = URL.createObjectURL(blob);
  el.download = nom;
  el.click(); URL.revokeObjectURL(el.href);
}

let archDate = new Date();
let archTheme = "";
let archImgs = [];
let archBusy = false;

function key2(d){
  return String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
}
function eventsOn(d){
  const k = key2(d);
  return EVENTS.filter(e => e.startsWith(k + "|")).map(e => {
    const p = e.split("|");
    return {mmjj: p[0], an: parseInt(p[1], 10), titre: p[2], desc: p[3], wiki: p[4]};
  }).sort((a, b) => a.an - b.an);
}

/* ---- recherche d'images, avec la licence ---- */
async function searchImages(q){
  archBusy = true; archImgs = []; renderArch();
  const found = [];

  // 1. bibliotheque d'images de la NASA
  try{
    const r = JSON.parse(await getText(
      "https://images-api.nasa.gov/search?media_type=image&q=" + encodeURIComponent(q)));
    (r.collection.items || []).slice(0, 12).forEach(it => {
      const d = (it.data || [])[0] || {};
      const thumb = (it.links || [])[0];
      if(!thumb || !thumb.href) return;
      const who = d.photographer || d.secondary_creator || "";
      found.push({
        src: thumb.href,
        titre: d.title || "",
        desc: (d.description || "").slice(0, 300),
        date: (d.date_created || "").slice(0, 10),
        credit: who ? "NASA / " + who : "NASA",
        licence: "Domaine public, citation de la NASA demandee",
        page: "https://images.nasa.gov/details/" + (d.nasa_id || ""),
        maison: "NASA"
      });
    });
  }catch(e){ /* on continue avec Commons */ }

  // 2. Wikimedia Commons, qui expose la licence de chaque fichier
  try{
    const u = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*" +
      "&generator=search&gsrnamespace=6&gsrlimit=14&gsrsearch=" + encodeURIComponent(q) +
      "&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=640";
    const r = JSON.parse(await getText(u));
    const pages = (r.query && r.query.pages) || {};
    Object.values(pages).forEach(pg => {
      const ii = (pg.imageinfo || [])[0];
      if(!ii) return;
      const m = ii.extmetadata || {};
      const val = k => (m[k] && m[k].value ? strip(m[k].value) : "");
      const lic = val("LicenseShortName");
      if(/fair use|non-free/i.test(lic)) return;
      found.push({
        src: ii.thumburl || ii.url,
        titre: (pg.title || "").replace(/^File:/, ""),
        desc: val("ImageDescription").slice(0, 300),
        date: val("DateTimeOriginal").slice(0, 10),
        credit: val("Artist") || val("Credit") || "auteur non precise",
        licence: lic || "licence non precisee",
        page: "https://commons.wikimedia.org/wiki/" + encodeURIComponent(pg.title || ""),
        maison: "Commons"
      });
    });
  }catch(e){ /* rien */ }

  archImgs = found;
  archBusy = false;
  renderArch();
  if(!found.length) toast("Aucune image trouvee pour cette recherche");
}

function creditLine(im){
  return im.maison === "NASA"
    ? "Credit : " + im.credit
    : "Credit : " + im.credit + " (" + im.licence + ")";
}

/* ---- affichage ---- */
function renderArch(){
  const box = document.getElementById("viewArch");
  const evs = eventsOn(archDate);
  const now = new Date();
  const jour = archDate.toLocaleDateString("fr-FR", {day:"numeric", month:"long"});

  let s = '<div class="ephem"><div class="eh">' +
    '<button class="btn" id="dayPrev">jour precedent</button>' +
    '<h2>' + esc(jour) + '</h2>' +
    '<button class="btn" id="dayNext">jour suivant</button>' +
    '<button class="btn" id="dayToday">aujourd\'hui</button></div>';

  if(!evs.length){
    s += '<p class="cempty">Rien de repertorie a cette date. Essaie un autre jour, ' +
      'ou passe par la recherche par theme juste en dessous.</p>';
  }else{
    s += evs.map(e => {
      const ans = now.getFullYear() - e.an;
      return '<div class="ev"><div class="eyr">' + e.an + '</div><div>' +
        '<div class="et">' + esc(e.titre) + '</div>' +
        '<div class="eago">il y a ' + ans + ' ans</div>' +
        '<p class="ed">' + esc(e.desc) + '</p>' +
        '<div class="cb">' +
          '<a href="https://fr.wikipedia.org/wiki/' + esc(e.wiki) + '" target="_blank" rel="noopener">verifier sur Wikipedia</a>' +
          '<button data-imgs="' + esc(e.titre) + '">chercher des images</button>' +
          '<button data-carou="' + esc(e.an + "|" + e.titre + "|" + e.desc) + '">generer le carrousel</button>' +
        '</div></div></div>';
    }).join("");
  }
  s += '</div>';

  s += '<div class="theme"><div class="eh"><h2>Recherche par theme</h2></div>' +
    '<div class="addbox"><input id="thq" placeholder="nebuleuse, astronaute entrainement, rover martien..." ' +
    'value="' + esc(archTheme) + '" autocomplete="off">' +
    '<button class="btn" id="thGo">Chercher</button></div>' +
    '<p class="hintline">Sources interrogees : bibliotheque d\'images de la NASA et Wikimedia Commons. ' +
    'La licence de chaque image est affichee, verifie la avant publication.</p>';

  if(archBusy) s += '<p class="cempty">Recherche en cours…</p>';
  else if(archImgs.length){
    s += '<div class="grid">' + archImgs.map((im, i) =>
      '<figure class="im"><img src="' + esc(im.src) + '" alt="" loading="lazy" onerror="this.closest(\'figure\').remove()">' +
      '<figcaption><div class="imt">' + esc(im.titre) + '</div>' +
      '<div class="imc">' + esc(creditLine(im)) + '</div>' +
      '<div class="cb"><a href="' + esc(im.page) + '" target="_blank" rel="noopener">fiche source</a>' +
      '<button data-cred="' + i + '">copier le credit</button></div>' +
      '</figcaption></figure>').join("") + '</div>';
  }
  s += '</div>';

  box.innerHTML = s;
}

async function archCarousel(payload){
  if(!hasAI()){ toast("Fonction disponible une fois la page en ligne"); return; }
  const p = payload.split("|");
  toast("Redaction en cours…");
  try{
    const out = await ask(
      STYLE + " Tu reponds uniquement par du JSON, sans texte autour.",
      "Redige un carrousel Instagram commemoratif.\n\n" +
      "EVENEMENT : " + p[1] + "\nANNEE : " + p[0] + "\nRESUME : " + p[2] + "\n" +
      "ANNIVERSAIRE : " + (new Date().getFullYear() - parseInt(p[0], 10)) + " ans\n\n" +
      "Tu ne disposes que de ces elements. Tu peux mobiliser le contexte historique general " +
      "de cet evenement, mais tu signales dans a_verifier tout chiffre, date precise ou nom " +
      "que tu avances et qui ne figure pas dans le resume ci-dessus. Sois exhaustif sur ce point : " +
      "c'est un contenu commemoratif, une erreur de date serait immediatement reperee.\n\n" +
      "FORMAT\nUne couverture, puis 3 ou 4 slides de contenu.\n" +
      "Couverture : titre de 4 a 8 mots en capitales, sous-titre de 4 a 8 mots. " +
      "Le titre dit simplement ce qui s'est passe ce jour la, sans metaphore ajoutee, " +
      "sans imperatif publicitaire et sans superlatif. Le sous-titre apporte une precision " +
      "concrete : le lieu, les protagonistes ou l'enjeu. " +
      "Quelqu'un qui ne connait pas l'evenement doit comprendre de quoi il s'agit " +
      "en lisant ces deux lignes seules. Pas de sigle ni de designation technique en titre.\n" +
      "Le slide 2 expose le fait : ce qui s'est passe ce jour-la, sans detour ni mise en scene. " +
      "Les suivants approfondissent.\n" +
      "Chaque slide : titre court en capitales, 5 mots maximum. " +
      "Type texte pour un paragraphe de " + longueur().mots + ", type liste pour ce qui s'enumere.\n" +
      "Va a l'essentiel, chaque phrase doit apporter une information.\n" +
      "surligner : 2 a 4 expressions exactes du texte du slide.\n" +
      "Pour chaque slide : type_visuel valant archive ou illustration, " +
      "visuel decrivant l'image a chercher dans les archives, " +
      "et prompt_ia, une consigne de generation en anglais de 20 a 40 mots, sujet et composition " +
      "seulement, sans style ni couleur. Jamais de personne reelle identifiable dans prompt_ia, " +
      "jamais un engin ou un lieu historique rendu de facon realiste : " +
      "pour ces cas, type_visuel vaut archive.\n" +
      "legende : 3 a 5 phrases. Ne cite aucune source que tu n'as pas.\n" +
      "hashtags : 8 hashtags.\n\n" +
      "JSON : {\"titre\":\"\",\"sous_titre\":\"\"," +
      "\"visuel\":\"\",\"type_visuel\":\"archive\",\"prompt_ia\":\"\"," +
      "\"slides\":[{\"titre\":\"\",\"type\":\"texte\",\"texte\":\"\",\"puces\":[],\"surligner\":[\"\"]," +
      "\"visuel\":\"\",\"type_visuel\":\"archive\",\"prompt_ia\":\"\"}]," +
      "\"legende\":\"\",\"a_verifier\":[\"\"],\"hashtags\":\"\"}",
      3000
    );
    const sl = parseJson(out);
    const item = {
      key: "ev-" + p[0] + "-" + p[1],
      title: p[1] + " (" + p[0] + ")",
      fr: p[1] + ", il y a " + (new Date().getFullYear() - parseInt(p[0], 10)) + " ans",
      link: "https://fr.wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(p[1]),
      src: "Ephemeride", t: Date.now(), excerpt: p[2], img: "",
      author: "", social: false, slides: sl, saved: Date.now()
    };
    sl._note = "ephemeride, aucun article source";
    saveMade(item);
    toast("Carrousel pret, onglet Carrousels");
    setView("made");
  }catch(e){
    toast("Echec : " + e.message);
  }
}

/* ---- evenements ---- */
document.getElementById("viewArch").addEventListener("click", e => {
  const t = e.target;
  if(t.id === "dayPrev"){ archDate.setDate(archDate.getDate() - 1); renderArch(); return; }
  if(t.id === "dayNext"){ archDate.setDate(archDate.getDate() + 1); renderArch(); return; }
  if(t.id === "dayToday"){ archDate = new Date(); renderArch(); return; }
  if(t.id === "thGo"){
    const v = document.getElementById("thq").value.trim();
    if(v){ archTheme = v; searchImages(v); }
    return;
  }
  const bi = t.closest("button[data-imgs]");
  if(bi){ archTheme = bi.dataset.imgs; searchImages(bi.dataset.imgs); return; }
  const bc = t.closest("button[data-carou]");
  if(bc){ archCarousel(bc.dataset.carou); return; }
  const cr = t.closest("button[data-cred]");
  if(cr){
    const im = archImgs[parseInt(cr.dataset.cred, 10)];
    navigator.clipboard.writeText(creditLine(im) + " — " + im.page).then(() => toast("Credit copie"));
  }
});
document.getElementById("viewArch").addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "thq"){
    e.preventDefault();
    const v = e.target.value.trim();
    if(v){ archTheme = v; searchImages(v); }
  }
});

function setView(v){
  document.getElementById("viewNews").hidden = v !== "news";
  document.getElementById("viewMade").hidden = v !== "made";
  document.getElementById("viewArch").hidden = v !== "arch";
  document.getElementById("navNews").setAttribute("aria-pressed", v === "news");
  document.getElementById("navMade").setAttribute("aria-pressed", v === "made");
  document.getElementById("navArch").setAttribute("aria-pressed", v === "arch");
  if(v === "arch") renderArch();
  if(v === "made") renderMade();
}
document.getElementById("navNews").addEventListener("click", () => setView("news"));
document.getElementById("navMade").addEventListener("click", () => setView("made"));
document.getElementById("navArch").addEventListener("click", () => setView("arch"));

/* ---------- démarrage ---------- */
drawCarnetBtn();
drawMadeBtn();
load();
solar();
setInterval(() => { load(); solar(); }, 15 * 60 * 1000);
</script>
